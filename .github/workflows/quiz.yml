name: Квиз по матану

on:
  schedule:
    - cron: "5 14 * * 1-6"   # Пн-Сб в 18:05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python quiz.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz_state.json
          git diff --staged --quiet || git commit -m "Update quiz state"
          git push