name: Воскресный дайджест

on:
  schedule:
    - cron: "0 14 * * 0"    # Воскресенье, 18:00 по Саратову
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow requests
      - run: python digest.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      
      # В придачу отправляем квиз по матану
      - name: Отправка квиза
        run: python quiz.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      
      # Сохраняем прогресс квиза
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add quiz_state.json
          git diff --staged --quiet || git commit -m "Update quiz state"
          git push